<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}生物样本假名化交付平台{% endblock %}</title>
<style>
  :root { --blue:#2563eb; --green:#16a34a; --red:#dc2626; --amber:#d97706; --gray:#64748b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
         background:#f1f5f9; color:#0f172a; }
  header { background:#0f172a; color:#fff; padding:16px 28px; display:flex; align-items:center; gap:24px; }
  header h1 { font-size:18px; margin:0; }
  header nav a { color:#cbd5e1; text-decoration:none; margin-right:18px; font-size:14px; }
  header nav a:hover { color:#fff; }
  main { max-width:1000px; margin:28px auto; padding:0 20px; }
  .card { background:#fff; border-radius:10px; padding:22px 24px; margin-bottom:22px;
          box-shadow:0 1px 3px rgba(15,23,42,.08); }
  h2 { margin:0 0 16px; font-size:17px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:9px 10px; border-bottom:1px solid #e2e8f0; vertical-align:top; }
  th { color:#475569; font-weight:600; background:#f8fafc; }
  code { background:#f1f5f9; padding:1px 6px; border-radius:4px; font-size:12px; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; color:#fff; }
  .pill.processing { background:var(--amber); }
  .pill.success { background:var(--green); }
  .pill.failed { background:var(--red); }
  .btn { display:inline-block; background:var(--blue); color:#fff; padding:8px 18px; border-radius:6px;
         text-decoration:none; font-size:14px; border:none; cursor:pointer; }
  .btn:disabled { background:#94a3b8; cursor:not-allowed; }
  .btn.secondary { background:#475569; }
  input[type=text] { padding:9px 12px; border:1px solid #cbd5e1; border-radius:6px; width:340px; font-size:14px; }
  .flash { padding:11px 16px; border-radius:6px; margin-bottom:16px; font-size:14px; }
  .flash.ok { background:#dcfce7; color:#166534; }
  .flash.error { background:#fee2e2; color:#991b1b; }
  .muted { color:var(--gray); font-size:13px; }
  .err-detail { background:#fef2f2; border-left:3px solid var(--red); padding:10px 14px;
                font-size:13px; color:#7f1d1d; word-break:break-all; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; word-break:break-all; }
  .upload-box { border:2px dashed #cbd5e1; border-radius:10px; padding:30px; text-align:center; }
  .upload-box input[type=file] { margin:12px 0; }
  .stat { display:inline-block; margin-right:26px; font-size:13px; color:#334155; }
  .stat b { font-size:18px; color:#0f172a; }
</style>
</head>
<body>
<header>
  <h1>生物样本假名化交付平台</h1>
  <nav>
    <a href="{{ url_for('index') }}">批次与上传</a>
    <a href="{{ url_for('mappings_page') }}">正式映射查询</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash {{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
